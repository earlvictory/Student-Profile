<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Student Profile</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 10px 0;
        font-family: Arial, Helvetica, sans-serif;
        background-color: whitesmoke;
        color: darkblue;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      main {
        width: 95%;
        max-width: 850px; 
        background-color: white;
        border: 1px solid lightgray;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        display: flex;
        flex-direction: column;
        border-radius: 4px;
        overflow: hidden;
      }

      header {
        position: relative;
        text-align: center;
        padding: 20px 15px;
      }

      .logo {
        position: absolute;
        left: 30px;
        top: 50%;
        transform: translateY(-50%);
        width: 80px; 
        height: 80px;
        object-fit: contain;
      }

      header h1 {
        font-family: "Georgia", serif;
        font-size: 2.2rem;
        color: #002b5b;
        margin-bottom: 4px;
        margin-top: 0;
      }

      header p {
        font-style: italic;
        color: dimgray;
        font-size: 1.1rem;
        margin: 0;
      }

      nav {
        background-color: #002b5b;
        text-align: center;
        padding: 10px 0;
        width: 100%;
      }

      nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
        font-size: 1rem;
        margin: 0 15px;
      }

      nav span.separator {
        color: white;
      }

      section.content-container {
        display: flex;
        padding: 25px 35px;
        gap: 25px;
      }

      article {
        flex: 1;
      }

      article:not(:last-child) {
        border-right: 1px solid lightgray;
        padding-right: 25px;
      }

      article h2 {
        font-size: 1.2rem;
        color: #002b5b;
        margin-bottom: 12px;
        margin-top: 0;
      }

      ul,
      ol {
        padding-left: 20px;
        font-size: 0.95rem;
        line-height: 1.6;
        margin: 0;
      }

      li {
        margin-bottom: 6px;
      }

      .info-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
        line-height: 1.6;
      }

      .info-table td {
        vertical-align: top;
        padding-bottom: 5px;
      }

      .info-table td.label {
        font-weight: bold;
        white-space: nowrap;
        width: 60px;
      }

      .info-table td.colon {
        width: 15px;
        text-align: center;
      }

      .image-row {
        display: flex;
        justify-content: center;
        gap: 15px;
        padding: 0 35px 25px 35px;
        width: 100%;
      }

      .row-img {
        flex: 1 1 0;
        width: 0;
        height: 160px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid lightgray;
      }

      footer {
        background-color: #002b5b;
        color: white;
        text-align: center;
        padding: 12px;
        font-size: 0.85rem;
        width: 100%;
      }

      @media (max-width: 600px) {
        main {
          width: 98%;
        }

        header {
          padding: 15px 10px;
        }

        .logo {
          width: 45px;
          height: 45px;
          left: 10px;
        }

        header h1 {
          font-size: 1.3rem;
        }

        header p {
          font-size: 0.8rem;
        }

        nav a {
          margin: 0 6px;
          font-size: 0.8rem;
        }

        section.content-container {
          padding: 15px 10px;
          gap: 8px;
        }

        article:not(:last-child) {
          padding-right: 8px;
        }

        article h2 {
          font-size: 0.85rem;
          margin-bottom: 8px;
        }

        ul, ol {
          padding-left: 14px;
          font-size: 0.72rem;
        }

        .info-table {
          font-size: 0.72rem;
        }

        .info-table td.label {
          width: 42px;
        }

        .image-row {
          padding: 0 10px 15px 10px;
          gap: 8px;
        }

        .row-img {
          height: 90px;
        }

        footer {
          font-size: 0.7rem;
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="Smc.jpg" alt="School Logo" class="logo" />
        <h1>My Gallery</h1>
        <p>Some of my memorable moments!</p>

      <nav>

      <section class="content-container">

          <table class="info-table">

            <tr>
              <td class="label">Date</td>
              <td class="colon">:</td>
              <td>07/29/2026</td>
            </tr>
            <tr>
              <td class="label">With</td>
              <td class="colon">:</td>
              <td>Classmates&nbsp;<br />Sir Timbal&nbsp;</td>
            </tr>
            <tr></tr>
          </table>
        </article>
      </section>

      <div class="image-row">
        <img src="gallary.jpg" alt="Photo 1" class="row-img" />
        <img src="gallary1.jpg" alt="Photo 2" class="row-img" />
        <img src="gallary2.jpg" alt="Photo 3" class="row-img" />
      </div>

      <footer>&copy; 2026 Earl Victory I. Rodriguez | BSIT-1A</footer>
    </main>
  </body>
</html>
